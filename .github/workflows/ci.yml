name: ClassOne AI CI

on:
  push:
    branches:
      - main
      - master
      - phase-10-ci-cd
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            services/student-service/package-lock.json
            services/learning-service/package-lock.json
            services/assessment-service/package-lock.json
            services/curriculum-service/package-lock.json
            services/ai-service/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Install Student Service dependencies
        run: npm --prefix services/student-service ci

      - name: Install Learning Service dependencies
        run: npm --prefix services/learning-service ci

      - name: Install Assessment Service dependencies
        run: npm --prefix services/assessment-service ci

      - name: Install Curriculum Service dependencies
        run: npm --prefix services/curriculum-service ci

      - name: Install AI Service dependencies
        run: npm --prefix services/ai-service ci

      - name: Build all services
        run: npm run build

      - name: Start backend
        run: npm --prefix backend start &

      - name: Wait for backend
        run: sleep 5

      - name: Backend health check
        run: curl --fail http://localhost:4000/api/health
